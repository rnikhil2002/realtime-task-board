# AWS Load Balancer Controller ingress. Sticky sessions are not needed because
# Redis Pub/Sub fans events out to every pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-board
  namespace: task-board
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: server, port: { number: 80 } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: server, port: { number: 80 } } }
