# Two API servers sit behind this proxy. Requests and sockets are spread across both,
# and Redis Pub/Sub keeps users on different servers in sync.
upstream api {
  server server-1:4000;
  server server-2:4000;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
